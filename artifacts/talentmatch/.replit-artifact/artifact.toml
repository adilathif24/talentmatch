kind = "web"
previewPath = "/"
title = "TalentMatch"
description = "An AI-assisted recruiting workspace that helps hiring teams evaluate candidates faster with transparent fit scores, skill evidence, and collaborative shortlists."
version = "1.0.0"
id = "artifacts/talentmatch"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25075

[services.development]
run = "pnpm --filter @workspace/talentmatch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talentmatch", "run", "build" ]
serve = "static"
publicDir = "artifacts/talentmatch/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25075"
BASE_PATH = "/"
